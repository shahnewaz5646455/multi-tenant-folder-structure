name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11'
          cache: npm
      - run: npm ci --ignore-scripts
      # Blueprint, section B "CI/CD": turbo --affected keeps pipelines short.
      - run: npx turbo run lint typecheck test build --affected

  api-schema-drift:
    name: API schema drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11'
          cache: npm
      - run: npm ci --ignore-scripts
      # Blueprint: CI fails if regeneration produces a diff.
      - run: npm run generate:api
        env:
          OPENAPI_SPEC_URL: ${{ secrets.OPENAPI_SPEC_URL }}
      - name: Fail on drift
        run: git diff --exit-code packages/api-client/src/schema.d.ts
